name: Build Android debug APK

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 28
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java 11 for Gradle 6
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      # Keep the debug signing certificate stable across ephemeral runners so
      # versionCode upgrades can be installed over the previous debug APK.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tinydrone-android-debug-keystore-v1

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: esp-drone-android-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
