name: Build Android debug APK

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 28
        run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - name: Set up Java 11 for Gradle 6
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      # Keep the debug signing certificate stable across ephemeral runners so
      # versionCode upgrades can be installed over the previous debug APK.
      - name: Restore debug signing key
        id: debug-signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tinydrone-android-debug-keystore-v1

      - name: Verify stable debug signing key
        run: |
          if [ "${{ steps.debug-signing-key.outputs.cache-hit }}" != "true" ] || [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "::error::Stable TinyDrone debug signing key is unavailable. Refusing to build an incompatible APK."
            exit 1
          fi

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Name APK from Android version
        run: |
          APK_VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          mv build/outputs/apk/debug/*.apk "build/outputs/apk/debug/ESP-Drone-Android-v${APK_VERSION}.apk"
          echo "APK_VERSION=${APK_VERSION}" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP-Drone-Android-v${{ env.APK_VERSION }}
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
